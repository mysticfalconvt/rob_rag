# Settings for pnpm (this is a single package, not a monorepo).

# Refuse package versions published less than 14 days ago. Most malicious
# releases are caught and pulled within days, so this keeps them out.
minimumReleaseAge: 20160

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - bcrypt
  - esbuild
ignoredBuiltDependencies:
  # sharp 0.33+ ships prebuilt binaries; its install script is not needed.
  - sharp

# Patched versions of nested dependencies (both inside the Prisma 6 CLI's
# config loader, which the container uses for `prisma migrate deploy`).
overrides:
  effect@<3.22.1: ^3.22.1
  deepmerge-ts@<8.0.0: ^8.0.0
